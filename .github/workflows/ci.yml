name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check lib/index.js && node --check lib/client.js

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Manifest sanity
        run: node -e "const p=require('./package.json'); const m=require('./dsh.plugin.json'); if(!p.dsh||!p.dsh.bundle||!p.dsh.client) process.exit(1); if(m.main!=='./lib/index.js') process.exit(1); console.log('manifests OK')"
